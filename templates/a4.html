<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventurní štítky</title>
  <style>
    /* Preserves the two-column/four-row A4 label positions in bark(1).docx. */
    @page { size: A4 portrait; margin: 0; }
    html, body { padding: 0; margin: 0; background: #fff; }
    body { font-family: "Liberation Serif", "Times New Roman", Times, serif; }

    .sheet {
      position: relative;
      box-sizing: border-box;
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      overflow: hidden;
      background: white;
      color: black;
      break-inside: avoid;
    }
    .label {
      position: absolute;
      box-sizing: border-box;
      width: 98.81mm;
      height: 71.12mm;
      left: 6.35mm;
      top: 6.35mm;
      font-size: 12pt;
      font-weight: normal;
    }
    .label:nth-child(even) { left: 105.16mm; }
    .label:nth-child(n+3):nth-child(-n+4) { top: 77.47mm; }
    .label:nth-child(n+5):nth-child(-n+6) { top: 148.59mm; }
    .label:nth-child(n+7) { top: 219.71mm; }

    .description {
      position: absolute;
      left: 0;
      top: 0.25mm;
      width: 98.81mm;
      line-height: 13.8pt;
      overflow-wrap: break-word;
    }
    .barcode {
      position: absolute;
      left: 0;
      top: var(--barcode-top);
      width: 91.23mm;
      height: 13.16mm;
      overflow: hidden;
    }
    .barcode svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }
    .reference {
      position: absolute;
      left: 0;
      top: var(--reference-top);
      font-size: 12pt;
      line-height: 13.8pt;
      white-space: nowrap;
    }
    @media print {
      html, body { width: 210mm; margin: 0; background: white; }
      .sheet { margin: 0; break-after: page; }
      .sheet:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
{% set barcode_y = [13.511, 14.182, 19.138, 19.456, 19.138, 18.803, 18.803, 18.468] %}
{% for page_entries in entries | batch(8) %}
<main class="sheet">
  {% for e in page_entries %}
  <section class="label" style="--barcode-top: {{ barcode_y[loop.index0] }}mm; --reference-top: {{ 29.4 if loop.index0 < 2 else 34.24 }}mm;">
    <div class="description">{{ e.name | e }}</div>
    <div class="barcode">{{ e.code_svg | safe }}</div>
    <div class="reference">{{ e.code | e }}</div>
  </section>
  {% endfor %}
</main>
{% endfor %}
</body>
</html>
