<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventurní štítky</title>
  <style>
    /* A4: 2 columns x 8 rows of 105 x 37 mm labels.
       The 296 mm of label rows are vertically centered (0.5 mm top/bottom). */
    @page { size: 210mm 297mm; margin: 0; }

    html, body {
      padding: 0;
      margin: 0;
      background: #fff;
    }
    body {
      font-family: "Liberation Serif", "Times New Roman", Times, serif;
      color: #000;
    }

    .sheet {
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(2, 105mm);
      grid-template-rows: repeat(8, 37mm);
      align-content: center;
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      break-inside: avoid;
    }

    .label {
      position: relative;
      box-sizing: border-box;
      width: 105mm;
      height: 37mm;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      font-size: 9.5pt;
      font-weight: normal;
      break-inside: avoid;
    }

    .description {
      position: absolute;
      left: 2.5mm;
      top: 1.5mm;
      width: 100mm;
      height: 9.6mm;
      max-height: 9.6mm;
      line-height: 4.8mm;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .barcode {
      position: absolute;
      left: 2.5mm;
      top: 12mm;
      width: 100mm;
      height: 14.5mm;
      overflow: hidden;
    }
    .barcode svg {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
    }

    .reference {
      position: absolute;
      left: 2.5mm;
      top: 28.5mm;
      width: 100mm;
      font-size: 9.5pt;
      line-height: 4.8mm;
      white-space: nowrap;
      overflow: hidden;
    }

    @media print {
      html, body { width: 210mm; margin: 0; }
      .sheet { margin: 0; break-after: page; }
      .sheet:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
{% for page_entries in entries | batch(16) %}
<main class="sheet">
  {% for e in page_entries %}
  <section class="label">
    <div class="description">{{ e.name | safe }}</div>
    <div class="barcode">{{ e.code_svg | safe }}</div>
    <div class="reference">{{ e.code | e }}</div>
  </section>
  {% endfor %}
</main>
{% endfor %}
</body>
</html>
